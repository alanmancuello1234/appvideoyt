<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guión → Video</title>
<style>
  :root {
    --bg: #0f1117; --card: #181b24; --text: #eef0f4; --muted: #9aa1ae;
    --accent: #6c8cff; --border: #2a2e3a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f8; --card: #ffffff; --text: #1a1c22; --muted: #666d7a; --border: #e1e3e8; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    padding: 20px; padding-bottom: 60px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; max-width: 560px; margin: 0 auto 16px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 16px; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 6px; color: var(--muted); }
  textarea, input {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 0.95rem;
  }
  textarea { min-height: 140px; resize: vertical; }
  button {
    width: 100%; margin-top: 16px; padding: 13px; border: none; border-radius: 10px;
    background: var(--accent); color: white; font-size: 1rem; font-weight: 600;
  }
  button:disabled { opacity: 0.5; }
  #estado { margin-top: 12px; font-size: 0.9rem; color: var(--muted); min-height: 20px; }
  a.descarga {
    display: block; margin-top: 10px; text-align: center; padding: 12px;
    background: #2ecc71; color: white; border-radius: 10px; text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎬 Guión → Video</h1>
  <p class="sub">Pegá tu guión, un párrafo por escena, y generá el video.</p>

  <label>Pexels API key</label>
  <input id="pexelsKey" type="password" placeholder="Se guarda solo en este navegador">

  <label>Pixabay API key</label>
  <input id="pixabayKey" type="password" placeholder="Se guarda solo en este navegador">

  <label>Guión</label>
  <textarea id="guion" placeholder="En 1453, el Imperio Bizantino vivía sus últimas horas.
Las murallas de Constantinopla, que habían resistido mil años...
El emperador Constantino XI sabía que no habría rendición posible."></textarea>

  <button id="btnGenerar">Generar video</button>
  <div id="estado"></div>
  <div id="descargaBox"></div>
</div>

<script>
  const pexelsInput = document.getElementById('pexelsKey');
  const pixabayInput = document.getElementById('pixabayKey');
  const guionInput = document.getElementById('guion');
  const btn = document.getElementById('btnGenerar');
  const estado = document.getElementById('estado');
  const descargaBox = document.getElementById('descargaBox');

  // Las keys quedan guardadas solo en este navegador, para no tener que pegarlas cada vez.
  pexelsInput.value = localStorage.getItem('pexelsKey') || '';
  pixabayInput.value = localStorage.getItem('pixabayKey') || '';

  btn.addEventListener('click', async () => {
    const guion = guionInput.value.trim();
    if (!guion) { estado.textContent = 'Pegá un guión primero.'; return; }

    localStorage.setItem('pexelsKey', pexelsInput.value);
    localStorage.setItem('pixabayKey', pixabayInput.value);

    btn.disabled = true;
    descargaBox.innerHTML = '';
    estado.textContent = 'Generando... esto puede tardar varios minutos según la cantidad de escenas.';

    try {
      const resp = await fetch('/generar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          guion,
          pexels_key: pexelsInput.value,
          pixabay_key: pixabayInput.value,
        }),
      });
      const data = await resp.json();

      if (!resp.ok) {
        estado.textContent = 'Error: ' + (data.error || 'desconocido');
      } else {
        estado.textContent = '¡Listo! ✅';
        descargaBox.innerHTML = `<a class="descarga" href="/descargar/${data.job_id}">⬇️ Descargar video</a>`;
      }
    } catch (e) {
      estado.textContent = 'Error de conexión: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
